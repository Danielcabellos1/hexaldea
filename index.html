<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Hexaldea: juego de mesa de construir y comerciar para jugar con amigos desde el móvil, con el tablero en la tele.">
<title>Hexaldea</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpolygon%20points%3D%2232%2C3%2057%2C17.5%2057%2C46.5%2032%2C61%207%2C46.5%207%2C17.5%22%20fill%3D%22%23e1b33b%22%2F%3E%3Cpath%20d%3D%22M20%2C44V31L32%2C20L44%2C31V44Z%22%20fill%3D%22%23e5383b%22%20stroke%3D%22%23141414%22%20stroke-width%3D%222.5%22%2F%3E%3C%2Fsvg%3E">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1622;--panel:#17212f;--panel2:#1f2c3d;--line:#2c3b50;--txt:#eef2f6;--mut:#94a3b8;--acc:#f4b942;--ok:#3ccf7e;--bad:#ff6b6b;--sea1:#1a5a8a;--sea2:#0f3d63;--r:14px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--panel2);padding:.7em 1em;transition:transform .08s,background .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.38;cursor:default}
button.pri{background:var(--acc);color:#1b1405;font-weight:700}
button.ok{background:var(--ok);color:#06210f;font-weight:700}
button.bad{background:#5a2330;color:#ffd6d6}
button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:.4em .7em;font-size:.9em;border-radius:10px}
input,select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.7em .9em;width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
.mut{color:var(--mut)} .sm-t{font-size:.85em} .big{font-size:1.25em}
.row{display:flex;gap:.6em;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1} .col{display:flex;flex-direction:column;gap:.6em}
.center{text-align:center}
.hide{display:none!important}

/* ---------- Inicio ---------- */
.home{max-width:520px;margin:0 auto;padding:28px 18px 40px;min-height:100%;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:14px;margin-top:8px}
.logo svg{width:64px;height:64px;flex:none}
.logo h1{font-size:2.3em;margin:0;letter-spacing:.5px}
.logo p{margin:2px 0 0;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:1.15em}
.bigbtn{width:100%;text-align:left;padding:16px 18px;display:flex;gap:14px;align-items:center;border-radius:16px}
.bigbtn .ic{font-size:1.8em;flex:none}
.bigbtn b{display:block;font-size:1.08em}
.bigbtn span{color:var(--mut);font-size:.9em}
.bigbtn.pri span{color:#4a3a10}
.codein{text-transform:uppercase;letter-spacing:.3em;font-size:1.4em;text-align:center;font-weight:700}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.colors button{aspect-ratio:1;border-radius:50%;padding:0;border:3px solid transparent;position:relative}
.colors button.on{border-color:#fff;box-shadow:0 0 0 3px var(--acc)}
.colors button.taken{opacity:.25}
.note{background:#22324a;border-left:4px solid var(--acc);padding:10px 12px;border-radius:8px;font-size:.92em}
.err-t{color:var(--bad)}
.spin{display:inline-block;width:1em;height:1em;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Tablero ---------- */
.sea{background:radial-gradient(ellipse at center,var(--sea1),var(--sea2) 75%);}
.board svg{display:block;width:100%;height:100%}
.hx-poly{stroke:#3b2f1c;stroke-width:1.2}
.beach{fill:#e8d39b;stroke:#e8d39b;stroke-width:9;stroke-linejoin:round}
.tok{fill:#f6ecd2;stroke:#5b4a2a;stroke-width:1}
.tok-n{font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#2b2112}
.tok-n.red{fill:#c62828}
.pip{fill:#2b2112} .pip.red{fill:#c62828}
.emo{text-anchor:middle;dominant-baseline:central;pointer-events:none}
.harb-l{stroke:#d9c08a;stroke-width:3;stroke-linecap:round}
.harb{fill:#fff8e6;stroke:#6b5530;stroke-width:1.2}
.harb-t{font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#3c2d12}
.road-o{stroke:#141414;stroke-linecap:round}
.bld{stroke:#141414;stroke-width:1.6;stroke-linejoin:round}
.robber{fill:#1d1d22;stroke:#e9e9e9;stroke-width:1.2}
.t-v,.t-e,.t-h{cursor:pointer}
.t-v{fill:rgba(255,255,255,.001)}
.t-e{stroke:rgba(255,255,255,.001);stroke-linecap:round}
.hl-v{fill:rgba(255,255,255,.55);stroke:#fff;stroke-width:2;pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
.hl-e{stroke:rgba(255,255,255,.6);stroke-linecap:round;pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
.hl-h{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:3;pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
.pk-v{fill:var(--acc);stroke:#000;stroke-width:2;pointer-events:none}
.pk-e{stroke:var(--acc);stroke-linecap:round;pointer-events:none}
.pk-h{fill:rgba(244,185,66,.35);stroke:var(--acc);stroke-width:5;pointer-events:none}
.fx{animation:fxp 1.4s ease-out 3}
@keyframes pulse{50%{opacity:.35}}
@keyframes fxp{0%{filter:drop-shadow(0 0 0 #fff)}40%{filter:drop-shadow(0 0 10px #fff)}100%{filter:drop-shadow(0 0 0 #fff)}}
.dim{opacity:.45}

/* ---------- Vista de jugador (móvil) ---------- */
.pv{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .code{font-weight:800;letter-spacing:.12em;font-size:.9em;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--ok)} .dot.half{background:var(--acc)}
.minis{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none}
.mini{display:flex;align-items:center;gap:4px;padding:3px 7px 3px 4px;border-radius:20px;background:var(--panel2);font-size:.8em;white-space:nowrap;border:2px solid transparent}
.mini.cur{border-color:var(--acc)}
.mini .sw{width:14px;height:14px;border-radius:50%}
.mini b{font-size:1.05em}
.iconbtn{background:transparent;padding:6px 8px;font-size:1.2em;border-radius:10px}
.banner{padding:9px 12px;font-weight:600;background:#1b2a3d;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:44px}
.banner.me{background:#4a3a10;color:#ffe9b0}
.banner .dice{font-size:1.6em;line-height:1}
.boardwrap{flex:1;min-height:180px;position:relative;overflow:hidden}
.boardwrap .board{position:absolute;inset:0;overflow:auto}
.boardwrap .board.zoom svg{width:175%;height:auto;min-height:100%}
.zoombtn{position:absolute;right:8px;bottom:8px;background:rgba(14,22,34,.75);font-size:1.1em;padding:8px 11px;z-index:2}
.offers{display:flex;flex-direction:column;gap:6px;padding:6px 8px;background:var(--panel)}
.offer{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:12px;padding:7px 9px;font-size:.92em}
.offer .what{flex:1}
.hand{display:flex;gap:6px;padding:8px;background:var(--panel);border-top:1px solid var(--line);align-items:stretch}
.rc{flex:1;border-radius:12px;padding:5px 2px 4px;text-align:center;background:var(--panel2);min-width:0;position:relative}
.rc .e{font-size:1.45em;line-height:1.1;display:block}
.rc .n{font-weight:800;font-size:1.15em}
.rc.zero{opacity:.4}
.rc.dev{background:#2a2346}
.rc .badge,.badge{position:absolute;top:-5px;right:-4px;background:var(--bad);color:#fff;border-radius:10px;font-size:.7em;padding:1px 6px;font-weight:700}
.actions{display:flex;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--panel);flex-wrap:wrap}
.actions button{flex:1 1 30%;min-height:50px;font-weight:600;position:relative}
.actions .full{flex-basis:100%}
.cost{display:inline-flex;gap:1px;font-size:.78em;opacity:.85;margin-left:4px}
.bcost{display:block;font-size:.75em;font-weight:400;opacity:.85;margin-top:2px}

/* ---------- Hojas y avisos ---------- */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:720px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h2{display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
.sec{margin:14px 0 6px;font-weight:700;color:var(--mut);font-size:.85em;text-transform:uppercase;letter-spacing:.06em}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.step{background:var(--panel2);border-radius:12px;padding:6px 2px;text-align:center}
.step .e{font-size:1.4em;display:block}
.step .v{font-weight:800;font-size:1.15em}
.step .h{display:block;font-size:.7em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .bt{display:flex;justify-content:center;gap:3px;margin-top:4px;padding:0 3px}
.step .bt button{padding:7px 0;flex:1;min-width:0;font-weight:800;background:#2b3b52}
.pickres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.pickres button{padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85em;border:2px solid transparent}
.pickres button .e{font-size:1.5em}
.pickres button.on{border-color:var(--acc);background:#3c3113}
.devc{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px;margin:6px 0}
.devc .e{font-size:1.8em}
.devc .d{flex:1;font-size:.9em}
.devc .d b{display:block;font-size:1.05em}
.prow{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--panel2);border-radius:12px;margin:6px 0;border-left:6px solid}
.prow .nm{flex:1;font-weight:700}
.prow .vp{font-size:1.4em;font-weight:900}
.stats{display:flex;gap:9px;font-size:.85em;color:var(--mut);flex-wrap:wrap}
.tag{display:inline-block;font-size:.72em;padding:1px 7px;border-radius:9px;background:#33445c;color:#cfe0f5;font-weight:600;vertical-align:2px}
.tag.gold{background:#5a4512;color:#ffe2a0}
.tag.off{background:#5a2330;color:#ffc9c9}
.loglist{display:flex;flex-direction:column;gap:4px;font-size:.92em}
.loglist div{padding:5px 8px;background:var(--panel2);border-radius:8px;display:flex;gap:7px;align-items:baseline}
.loglist .sw,.sw{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.toasts{position:fixed;left:0;right:0;top:56px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{background:#101a27;border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:92%;animation:tin .25s ease-out;font-weight:600}
.toast.err{border-color:var(--bad);color:#ffd1d1}
.toast.good{border-color:var(--ok)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.rules p,.rules li{font-size:.93em;line-height:1.45}
.rules ul{padding-left:1.2em;margin:.3em 0}

/* ---------- Vista de tele ---------- */
.tv{height:100vh;height:100dvh;display:grid;grid-template-columns:1fr minmax(320px,30vw);overflow:hidden}
.tv .tvboard{position:relative;min-height:0}
.tv .tvboard .board{position:absolute;inset:0;padding:1.5vh}
.tv aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;font-size:clamp(14px,1.05vw,26px)}
.tvhead{padding:1.2vh 1.2vw;display:flex;align-items:center;gap:.6em;border-bottom:1px solid var(--line)}
.tvhead .ttl{font-weight:900;font-size:1.35em;letter-spacing:.03em}
.tvhead .code{margin-left:auto;font-weight:800;letter-spacing:.15em;color:var(--mut)}
.tvturn{padding:1.4vh 1.2vw;border-bottom:1px solid var(--line);display:flex;gap:.8em;align-items:center}
.tvturn .who{font-size:1.4em;font-weight:900}
.tvturn .task{color:var(--mut)}
.tvturn .dice{font-size:3.2em;line-height:.9;margin-left:auto;white-space:nowrap}
.tvturn .dice.seven{color:var(--bad)}
.tvplayers{padding:.8vh 1vw;display:flex;flex-direction:column;gap:.7vh;overflow:auto}
.tvp{display:flex;align-items:center;gap:.7em;background:var(--panel2);border-radius:12px;padding:.6em .8em;border-left:.45em solid;border:2px solid transparent;border-left-width:.45em}
.tvp.cur{border-color:var(--acc)}
.tvp .nm{font-weight:800;font-size:1.1em}
.tvp .vp{margin-left:auto;font-size:2em;font-weight:900;min-width:1.5em;text-align:right}
.tvp .stats{font-size:.85em}
.tvlast{padding:1vh 1.2vw;font-weight:700;font-size:1.1em;border-top:1px solid var(--line);min-height:3em;display:flex;align-items:center;gap:.5em}
.tvlog{flex:1;overflow:hidden;padding:.6vh 1vw 1vh;display:flex;flex-direction:column;justify-content:flex-end;gap:.35em;font-size:.88em;color:#c8d3e0;min-height:0}
.tvlog div{display:flex;gap:.5em;align-items:baseline}
.tvfoot{padding:.8vh 1vw;border-top:1px solid var(--line);display:flex;gap:.5em;flex-wrap:wrap}
.tvfoot button{font-size:.85em;padding:.45em .8em}
.bankrow{display:flex;gap:.8em;padding:.6vh 1.2vw;font-size:.9em;color:var(--mut);border-bottom:1px solid var(--line);flex-wrap:wrap}

/* Sala en la tele */
.lobby{height:100vh;height:100dvh;display:grid;grid-template-columns:1.05fr 1fr;gap:3vw;padding:4vh 4vw;align-items:center}
.lobby .qrbox{background:#fff;border-radius:22px;padding:1.2vw;width:min(42vw,62vh);margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.lobby .qrbox svg{display:block;width:100%;height:auto}
.lobby .join{text-align:center;font-size:clamp(15px,1.4vw,30px)}
.lobby .join .code{font-size:2.6em;font-weight:900;letter-spacing:.2em;color:var(--acc)}
.lobby .join .url{color:var(--mut);word-break:break-all}
.lobby .side{display:flex;flex-direction:column;gap:1.4vh;font-size:clamp(15px,1.25vw,28px)}
.lobby .side h1{font-size:2.4em}
.seat{display:flex;align-items:center;gap:.7em;background:var(--panel);border-radius:14px;padding:.65em .9em;border-left:.5em solid}
.seat .nm{flex:1;font-weight:800;font-size:1.1em}
.seat.empty{border-left-color:var(--line)!important;color:var(--mut);font-style:italic}
.ctrls{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.ctrls select{width:auto}

/* Fin de partida */
.over{position:fixed;inset:0;background:rgba(5,10,18,.82);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.over .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:560px;width:100%;text-align:center}
.over .trophy{font-size:4em}
.over table{width:100%;border-collapse:collapse;margin:12px 0;text-align:left}
.over td{padding:7px 6px;border-bottom:1px solid var(--line)}
.over td:last-child{text-align:right;font-weight:900;font-size:1.2em}

@media (max-width:820px),(orientation:portrait){
  .tv{grid-template-columns:1fr;grid-template-rows:55vh 1fr;overflow:auto;height:auto;min-height:100vh}
  .tv aside{font-size:15px;border-left:0;border-top:1px solid var(--line)}
  .lobby{grid-template-columns:1fr;height:auto;min-height:100vh;padding:20px}
  .lobby .qrbox{width:min(80vw,360px)}
}
</style>
</head>
